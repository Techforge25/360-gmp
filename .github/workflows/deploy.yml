name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/gmp-backend

            echo "Pulling latest code..."
            git reset --hard
            git pull origin main

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting PM2..."
            pm2 restart gmp-backend || pm2 start npm --name "gmp-backend" -- start

            pm2 save