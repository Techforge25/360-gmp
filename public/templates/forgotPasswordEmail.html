<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Email</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f3f4f6; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            width="390"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 390px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e5e7eb;
              padding: 16px;
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #f3f4f6;
                  padding: 18px;
                  margin-bottom: 28px;
                "
              >
                <img
                  src="https://res.cloudinary.com/dh5msgx99/image/upload/v1780654460/Logo_Image_wer791.svg"
                  alt="360GMP"
                  style="
                    height: 28px;
                    display: block;
                    object-fit: contain;
                    border: 0;
                  "
                />
              </td>
            </tr>

            <!-- Spacer -->
            <tr>
              <td height="28"></td>
            </tr>

            <!-- Title -->
            <tr>
              <td
                style="
                  font-size: 16px;
                  font-weight: 700;
                  color: #111827;
                  padding-bottom: 18px;
                "
              >
                Login Verification
              </td>
            </tr>

            <!-- Subtitle -->
            <tr>
              <td
                style="
                  font-size: 14px;
                  color: #6b7280;
                  padding-bottom: 16px;
                "
              >
                Your verification code
              </td>
            </tr>

            <!-- OTP -->
            <tr>
              <td
                style="
                  font-size: 32px;
                  font-weight: 700;
                  color: #7c3aed;
                  letter-spacing: 2px;
                  padding-bottom: 24px;
                "
              >
                {{resetToken}}
              </td>
            </tr>

            <!-- Description -->
            <tr>
              <td
                style="
                  font-size: 14px;
                  line-height: 22px;
                  color: #6b7280;
                  padding-bottom: 28px;
                "
              >
                To complete your sign-in, please use the verification code
                below. This code will expire in 30 minutes.
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #f3f4f6;
                  padding: 16px;
                  text-align: center;
                  color: #4b5563;
                  font-size: 14px;
                "
              >
                © 2025 360GMP. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
